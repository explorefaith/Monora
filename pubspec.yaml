name: monora
description: "Monora — a warm, creamy music player for local + online songs."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter

  material_ui: 1.11.0

  just_audio: 0.10.6
  just_audio_background: 0.0.1-beta.17
  audio_session: 0.2.4

  on_audio_query: 2.9.0
  permission_handler: 13.0.2

  path_provider: 2.1.6

  http: 1.6.0
  cached_network_image: 4.0.7
  shared_preferences: 2.5.6

  provider: 6.1.5+1
  rxdart: 0.28.0
  palette_generator: 0.3.3+7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0

dependency_overrides:
  on_audio_query_android:
    path: plugins/on_audio_query_android

flutter:
  uses-material-design: true

  fonts:
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces.ttf
        - asset: assets/fonts/Fraunces-Italic.ttf
          style: italic
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans.ttf
        - asset: assets/fonts/PlusJakartaSans-Italic.ttf
          style: italic
    - family: HindSiliguri
      fonts:
        - asset: assets/fonts/HindSiliguri-Regular.ttf
          weight: 400
        - asset: assets/fonts/HindSiliguri-Medium.ttf
          weight: 500
        - asset: assets/fonts/HindSiliguri-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/HindSiliguri-Bold.ttf
          weight: 700
